<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행복기숙사 룸메이트 테스트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{
  --ink:#18233b; --blue:#2c5bd8; --yellow:#ffd85a; --sky:#dff4ff;
  --cream:#fffaf0; --pink:#ffdfe5; --mint:#dff7ec; --purple:#e8e0ff;
}
*{box-sizing:border-box}
body{margin:0;background:#eaf1f5;color:var(--ink);font-family:"Noto Sans KR",sans-serif}
button{font-family:inherit}
.page{max-width:720px;min-height:100vh;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13px;padding:4px 2px 14px}
.logo-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff786d;margin-right:6px}
.card{background:#fff;border:3px solid var(--ink);border-radius:32px;overflow:hidden;box-shadow:7px 8px 0 var(--ink)}
.hidden{display:none!important}

/* START */
.start-hero{position:relative;background:linear-gradient(145deg,#f9fdff 0%,#e8f6ff 52%,#fff1a9 100%);padding:35px 28px 28px;min-height:600px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(.2px);opacity:.9}
.b1{width:160px;height:160px;background:#ccecff;right:-55px;top:-45px}
.b2{width:100px;height:100px;background:#ffdfe5;left:-45px;bottom:40px}
.star{position:absolute;font-size:28px}
.s1{right:35px;top:125px}.s2{left:28px;top:250px}.s3{right:90px;bottom:38px}
.eyebrow{font-weight:900;color:var(--blue);font-size:13px;letter-spacing:.08em}
h1{font-family:"Jua",sans-serif;font-size:clamp(48px,11vw,76px);line-height:.96;letter-spacing:-.07em;margin:15px 0 14px}
.lead{font-size:16px;line-height:1.65;font-weight:700}
.mascot-wrap{width:235px;height:275px;background:#fff;border-radius:48% 48% 42% 42%;margin:28px auto 0;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:2;box-shadow:0 12px 0 rgba(24,35,59,.08)}
.mascot-wrap img{width:195px;margin-bottom:2px}
.pill{display:inline-block;background:var(--ink);color:#fff;border-radius:99px;padding:7px 12px;font-size:12px;font-weight:900;margin-top:20px}
.start-body{padding:22px 25px 28px}
.primary{width:100%;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:18px;padding:16px 18px;font-size:18px;font-weight:900;cursor:pointer;box-shadow:4px 5px 0 var(--ink)}
.primary:active{transform:translate(3px,3px);box-shadow:1px 2px 0 var(--ink)}
.subnote{text-align:center;color:#737a88;font-size:12px;margin-top:13px}

/* QUIZ */
.quiz-head{padding:21px 24px 12px;background:#fff}
.qtop{display:flex;justify-content:space-between;font-size:12px;font-weight:900;color:#747b88}
.track{height:9px;background:#edf0f3;border-radius:99px;margin-top:9px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:.25s}
.question-area{padding:25px 24px 30px}
.question-area h2{font-family:"Jua",sans-serif;font-size:30px;line-height:1.35;letter-spacing:-.04em;margin:0 0 22px}
.choice{width:100%;text-align:left;border:2px solid #e2e5e9;background:#fff;border-radius:19px;padding:17px 16px;margin:7px 0;cursor:pointer;font-size:15px;line-height:1.5;font-weight:700;color:var(--ink)}
.choice:hover{border-color:var(--blue);background:#f6f8ff}
.choice b{display:block;font-size:12px;color:var(--blue);margin-bottom:3px}

/* RESULT */
.result-top{padding:30px 24px 26px;text-align:center;background:linear-gradient(145deg,#fff 0%,#edf8ff 55%,#fff0ad 100%)}
.result-label{display:inline-block;background:var(--ink);color:#fff;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:900}
.result-mascot{width:185px;height:200px;margin:17px auto 10px;background:#fff;border-radius:40px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.result-mascot img{width:150px}
.result-type{font-family:"Jua",sans-serif;font-size:40px;letter-spacing:-.07em;margin:7px 0}
.result-desc{margin:0 auto;max-width:510px;line-height:1.7;font-weight:600}
.result-body{padding:25px}
.section-title{font-weight:900;font-size:15px;margin-bottom:13px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.badge{padding:8px 11px;border-radius:99px;font-size:12px;font-weight:900}
.b1c{background:#dff0ff}.b2c{background:#ffe5ea}.b3c{background:#e5f8ed}.b4c{background:#eee8ff}
.advice{background:#f5f2ea;border-radius:20px;padding:17px;line-height:1.7;font-size:14px;margin:18px 0}
.share-card{border:2px dashed #b7bec8;border-radius:18px;padding:15px;text-align:center;margin:18px 0;font-size:13px;font-weight:700}
.buttons{display:grid;gap:10px}
.secondary{background:#fff}
.footer{text-align:center;color:#8a909b;font-size:11px;line-height:1.5;margin-top:16px}
</style>
</head>
<body>

  <div class="result-body">
    <div class="section-title">이런 점이 잘 맞아요</div>
    <div class="badges" id="badges"></div>
    <div class="advice" id="advice"></div>
    <div class="share-card">나는 <strong id="shareType"></strong> 룸메이트!<br>여러분의 룸메이트 유형도 확인해보세요 👀</div>
    <div class="buttons">
      <button class="primary" onclick="shareResult()">결과 공유하기</button>
      <button class="primary secondary" onclick="location.reload()">다시 테스트하기</button>
    </div>
    <div class="footer">행복기숙사 · 기숙사 생활 스타일 테스트<br>#행복기숙사 #룸메이트테스트</div>
  </div>
</section>
</div>

<script>
const questions=[
["룸메이트가 시험기간이라 조용히 해달라고 한다면?",[
["🤫 바로 조용 모드 ON",{quiet:3,care:2}],["🎧 필요한 일만 조용히 한다",{quiet:2,care:1}],["🙂 평소처럼 생활한다",{social:1}]
]],
["방에서 사용한 물건은 보통 어떻게 하나요?",[
["✨ 바로 제자리에 둔다",{clean:3}],["🧺 눈에 띄는 것부터 정리한다",{clean:2}],["🙈 필요할 때 한꺼번에 정리한다",{clean:0}]
]],
["갑자기 룸메이트가 '밥 먹으러 갈래?' 한다면?",[
["🍚 좋아! 바로 가자",{social:3,energy:2}],["☕ 일정 보고 가능하면 간다",{social:2}],["🛏️ 오늘은 혼자 쉬고 싶다",{home:3}]
]],
["룸메이트와 생활패턴이 다르다면?",[
["💬 서로 편한 방법을 이야기한다",{care:3,quiet:1}],["🙌 서로 조금씩 맞춰본다",{care:2,adapt:2}],["🤷 각자 알아서 하면 된다고 생각한다",{independent:2}]
]],
["기숙사에서 쉬는 날, 가장 하고 싶은 것은?",[
["🧹 방 정리하고 깔끔하게 쉬기",{clean:3}],["🎧 혼자 음악·영상 보며 충전하기",{home:3,quiet:1}],["🍿 친구들과 만나 놀기",{social:3,energy:2}]
]],
["공용공간을 사용한 뒤에는?",[
["🧼 다음 사람을 위해 깔끔하게 정리한다",{clean:2,care:3}],["👍 눈에 띄는 것만 정리한다",{clean:1,care:1}],["🚶 내 물건만 챙기고 나온다",{independent:2}]
]],
["새로운 기숙사 프로그램이 열린다면?",[
["🎉 일단 참여해본다",{social:3,energy:2}],["👀 내용부터 살펴본다",{adapt:2}],["🏠 나는 내 방에서 쉬겠다",{home:3}]
]],
["룸메이트가 힘들어 보인다면?",[
["🫶 먼저 괜찮은지 물어본다",{care:3,social:1}],["🍫 필요한 게 있는지 조심스럽게 챙긴다",{care:2}],["🌿 방해하지 않고 기다려준다",{quiet:2,care:1}]
]],
["내일 중요한 일정이 있다면?",[
["📅 전날부터 준비한다",{plan:3,independent:1}],["📝 필요한 것만 미리 챙긴다",{plan:2}],["🏃 당일에 준비해도 괜찮다",{adapt:2}]
]],
["룸메이트와 가장 중요하다고 생각하는 것은?",[
["🧹 깨끗하고 정돈된 공간",{clean:3}],["🤫 서로의 시간과 생활 리듬 존중",{quiet:3,care:1}],["🎉 편하게 이야기하고 함께 즐기는 것",{social:3,energy:2}],["🌿 각자의 생활을 존중하는 것",{independent:3}]
]]
];

const types=[
{name:"깔끔 룸메이트",desc:"정돈된 공간이 편안한 당신! 함께 사는 공간을 깨끗하게 유지하고 작은 불편도 미리 줄이는 타입이에요.",keys:["clean"],badges:["정리정돈","청결","깔끔한 생활"],advice:"✨ 룸메이트에게는 '같이 쓰는 공간을 깔끔하게 유지하는 사람'으로 기억될 가능성이 높아요. 작은 정리 습관이 편안한 기숙사 생활을 만들어요."},
{name:"조용한 룸메이트",desc:"서로의 생활 리듬을 존중하는 당신! 조용하고 편안한 분위기에서 가장 편하게 지내는 타입이에요.",keys:["quiet"],badges:["조용한 생활","배려","개인시간"],advice:"🌙 서로의 수면·공부 시간을 존중하는 생활이 잘 맞아요. 필요한 이야기는 조용히, 하지만 분명하게 나누면 더 편안해요."},
{name:"활기찬 룸메이트",desc:"사람과 함께할 때 에너지가 올라가는 당신! 기숙사에서도 즐거운 분위기를 만드는 타입이에요.",keys:["social","energy"],badges:["사교적","에너지","함께하기"],advice:"🎉 같이 밥 먹고 이야기하는 즐거움을 좋아하는 편! 다만 룸메이트의 휴식 시간도 함께 배려하면 최고의 조합이 될 수 있어요."},
{name:"배려형 룸메이트",desc:"상대방의 입장을 한 번 더 생각하는 당신! 함께 사는 사람에게 편안함을 주는 따뜻한 타입이에요.",keys:["care"],badges:["공감","배려","소통"],advice:"🫶 '괜찮아?' 한마디와 작은 배려가 당신의 강점이에요. 서로 원하는 생활방식을 미리 이야기하면 더 좋은 룸메이트가 될 수 있어요."},
{name:"계획형 룸메이트",desc:"생활 리듬을 스스로 잘 관리하는 당신! 일정과 할 일을 챙기며 안정적인 생활을 만드는 타입이에요.",keys:["plan","independent"],badges:["자기관리","계획","규칙적인 생활"],advice:"📅 규칙적인 생활이 강점! 룸메이트와 일정이 다를 때는 미리 공유해두면 서로의 생활도 훨씬 편해져요."},
{name:"집콕 충전형",desc:"나만의 공간에서 에너지를 충전하는 당신! 혼자 쉬는 시간과 편안한 생활을 중요하게 생각하는 타입이에요.",keys:["home"],badges:["혼자만의 시간","편안함","집콕"],advice:"🛋️ 혼자만의 시간을 존중받을 때 행복도가 올라가요. 대신 필요한 순간에는 룸메이트와 가볍게 소통해보세요."},
{name:"유연한 적응형",desc:"상황에 맞춰 자연스럽게 적응하는 당신! 서로 다른 생활습관도 유연하게 받아들이는 타입이에요.",keys:["adapt"],badges:["적응력","유연함","편안한 소통"],advice:"🧩 새로운 환경이나 다른 생활패턴에도 비교적 잘 적응하는 편이에요. 룸메이트와 기준을 함께 정하면 더 편해요."},
{name:"독립적인 룸메이트",desc:"각자의 생활을 존중하는 당신! 지나치게 간섭하지 않고 편안한 거리를 유지하는 타입이에요.",keys:["independent"],badges:["독립적","개인존중","쿨한 생활"],advice:"🌿 서로의 영역을 존중하는 것이 강점이에요. 다만 불편한 점은 쌓아두지 말고 짧게라도 이야기하는 게 좋아요."}
];

let q=0, score={};
function startTest(){document.getElementById("start").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");renderQ();}
function renderQ(){
 const item=questions[q];
 document.getElementById("qnum").textContent=`Q${q+1} / ${questions.length}`;
 document.getElementById("track").style.width=((q+1)/questions.length*100)+"%";
 document.getElementById("question").textContent=item[0];
 const box=document.getElementById("choices");box.innerHTML="";
 item[1].forEach((choice,i)=>{
   const b=document.createElement("button");b.className="choice";
   b.innerHTML=`<b>${i+1}</b>${choice[0]}`;
   b.onclick=()=>answer(choice[1]);box.appendChild(b);
 });
}
function answer(points){
 Object.entries(points).forEach(([k,v])=>score[k]=(score[k]||0)+v);
 q++;
 if(q<questions.length) renderQ(); else showResult();
}
function showResult(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 let ranked=types.map((t,i)=>({t,i,s:t.keys.reduce((sum,k)=>sum+(score[k]||0),0)})).sort((a,b)=>b.s-a.s);
 const t=ranked[0].t;
 document.getElementById("typeName").textContent=t.name;
 document.getElementById("typeDesc").textContent=t.desc;
 document.getElementById("shareType").textContent=t.name;
 document.getElementById("badges").innerHTML=t.badges.map((x,i)=>`<span class="badge ${["b1c","b2c","b3c","b4c"][i%4]}">${x}</span>`).join("");
 document.getElementById("advice").innerHTML=t.advice;
}
async function shareResult(){
 const type=document.getElementById("shareType").textContent;
 const text=`나의 룸메이트 유형은 "${type}"! 행복기숙사 룸메이트 테스트`;
 if(navigator.share){try{await navigator.share({title:"행복기숙사 룸메이트 테스트",text,url:location.href});}catch(e){}}
 else{try{await navigator.clipboard.writeText(text+" "+location.href);alert("결과 링크가 복사됐어요!");}catch(e){alert(text);}}
}
</script>
</body>
</html>
